{% extends "base.html" %}
{% block title %}{{ '프로젝트 수정' if project else '프로젝트 생성' }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <div class="text-[50px] text-gray-500">
        JungleTrek : project tracker
    </div>

    <div class="bg-white rounded-xl border p-6 space-y-6">

        <div class="flex items-center justify-between">
            <span class="font-medium text-lg">{{ '프로젝트 수정' if project else '프로젝트 생성' }}</span>
            <a href="/" class="text-gray-400 hover:text-emerald-600 text-sm">← 목록으로</a>
        </div>

        <form method="post" action="{{ form_action or '/create' }}" class="space-y-6">

            <div class="space-y-1">
                <label for="title" class="text-sm font-medium text-gray-700">프로젝트 타이틀</label>
                <input type="text" id="title" name="title" value="{{ project.title if project else '' }}"
                    class="border w-full p-2 rounded outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div class="space-y-1">
                <label for="team" class="text-sm font-medium text-gray-700">팀명</label>
                <input type="text" id="team" name="team" value="{{ project.team if project else '' }}"
                    class="border w-full p-2 rounded outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div class="space-y-1">
                <label for="description" class="text-sm font-medium text-gray-700">프로젝트 정보</label>
                <textarea id="description" name="description" rows="4"
                    class="border w-full p-2 rounded outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">{{ project.description if project else '' }}</textarea>
            </div>

            <fieldset class="space-y-2">
                <legend class="text-sm font-medium text-gray-700 mb-1">프로젝트 기간</legend>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label for="start_date" class="text-xs text-gray-400">시작일</label>
                        <input type="date" id="start_date" name="start_date"
                            value="{{ project.start_date if project else '' }}"
                            class="border w-full p-2 rounded outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                    </div>
                    <div class="space-y-1">
                        <label for="end_date" class="text-xs text-gray-400">종료일</label>
                        <input type="date" id="end_date" name="end_date"
                            value="{{ project.end_date if project else '' }}"
                            class="border w-full p-2 rounded outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                    </div>
                </div>
            </fieldset>

            <fieldset class="space-y-2 border-t pt-4">
                <legend class="text-sm font-medium text-gray-700 mb-1">팀원 관리</legend>
                <div class="flex gap-2">
                    <input type="text" id="search-box" autocomplete="off" placeholder="이름 또는 이메일로 검색"
                        class="border flex-1 p-2 rounded outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                    <button type="button" id="search-member"
                        class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-all">검색</button>
                </div>
                <div id="search-result"
                    class="max-h-48 overflow-y-auto border rounded-lg divide-y text-sm empty:border-0"></div>
                <div id="added-member" class="flex flex-wrap gap-2 pt-1"></div>
            </fieldset>

            <button type="submit" id="submit-btn"
                class="flex items-center justify-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md hover:shadow-lg transition-all w-full">
                {{ '저장' if project else '프로젝트 생성' }}
            </button>
            <input type="hidden" id="members" name="members">
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>const initialMembers = {{ project.members | tojson if project else '[]' }};</script>
<script src="{{ url_for('static', filename='js/create.js') }}"></script>
{% endblock %}
