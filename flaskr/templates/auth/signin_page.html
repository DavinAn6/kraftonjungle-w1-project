{% extends "base.html" %}

{% block content %}

<div class="signin-wrapper">
    <h2>Login</h2>
    <form id="signin_form" action="/signin" method="post">
        이름: <input type="text" id="name" name="name" placeholder="이름" maxlength="50" required /><br>
        이메일: <input type="email" id="email" name="email" placeholder="이메일" maxlength="320" required />
        <button type="button" onclick="chkEmail()">이메일 중복 확인</button><br>
        <pre id="useEmail"></pre>
        기수:
        <select id="jungle" name="jungle">
            <option value="13">13</option>
        </select><br>
        강의장:
        <select id="classroom" name="classroom">
            <option value="301">301</option>
            <option value="302">302</option>
            <option value="303">303</option>
            <option value="304">304</option>
            <option value="305">305</option>
            <option value="306">306</option>
            <option value="307">307</option>
            <option value="308">308</option>
            <option value="309">309</option>
            <option value="310">310</option>
        </select><br>
        ID: <input type="text" id="username" name="username" placeholder="아이디" maxlength="50" required />
        <button type="button" onclick="chkID()">아이디 중복 확인</button><br>
        <pre id="useUsername"></pre>
        <br>
        비밀번호: <input type="password" id="password" name="password" placeholder="비밀번호" minlength="8" maxlength="50"
            required /><br>
        비밀번호 확인: <input type="password" id="chkpassword" name="chkpassword" placeholder="비밀번호 확인" minlength="8"
            maxlength="50" onkeyup="chkPassword()" required /><br>
        <pre id="usePasswd"></pre>

        <br><br>
        <button type="submit">이 정보로 가입</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{url_for('static', filename='signin.js')}}"></script>
{ % endblock % }
