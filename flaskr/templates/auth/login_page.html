{% extends "base.html" %}

{% block title %}로그인 | JungleTrek{% endblock %}

{% block content %}
<main class="flex min-h-[calc(100vh-4rem)] items-start justify-center pt-16">
    <form id="login_form" action="/login" method="post" autocomplete="on"
        class="w-full max-w-sm space-y-5 rounded-xl border border-gray-200 bg-white p-8 text-sm text-gray-600 shadow-xl">
        <header class="text-center">
            <h1 class="mt-1 text-2xl font-bold text-gray-900">로그인</h1>
        </header>

        <div>
            <label for="username" class="block font-medium text-gray-700">아이디</label>
            <input type="text" id="username" name="username" minlength="8" maxlength="50" required
                autocomplete="username" placeholder="아이디를 입력하세요"
                class="mt-1 w-full rounded-md border border-gray-300 p-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
        </div>

        <div>
            <label for="password" class="block font-medium text-gray-700">비밀번호</label>
            <input type="password" id="password" name="password" maxlength="50" required
                autocomplete="current-password" placeholder="비밀번호를 입력하세요"
                class="mt-1 w-full rounded-md border border-gray-300 p-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
        </div>

        <button type="submit"
            class="w-full rounded-md bg-emerald-500 py-2.5 font-semibold text-white transition hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-300">
            로그인
        </button>

        <p class="text-center text-gray-500">
            아직 계정이 없나요?
            <a href="/signin" class="font-medium text-emerald-500 hover:text-emerald-600">회원가입</a>
        </p>
    </form>
</main>
{% endblock %}
